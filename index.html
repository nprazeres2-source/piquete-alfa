<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>ALFA · Registo de Serviço 2026</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2430">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F0;
  --paper:#FFFFFF;
  --ink:#1B2430;
  --ink-soft:#5B6470;
  --line:#DBE0DC;
  --brick:#B23A2E;
  --brick-dark:#8C2C22;
  --amber:#C9862C;
  --teal:#3E6E64;
  --green:#3E7A4E;
  --grey-badge:#9AA3A8;
  --radius:12px;
  --font-head:'Roboto Slab',serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
body{padding-bottom:env(safe-area-inset-bottom);}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--brick);color:#fff;}

/* ---- Topbar ---- */
.topbar{background:var(--ink);color:#F3F1EC;padding:18px 18px 16px;position:sticky;top:0;z-index:20;
  border-bottom:3px solid var(--brick);}
.topbar .plate{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.topbar h1{font-family:var(--font-head);font-weight:700;font-size:26px;margin:0;letter-spacing:0.5px;}
.topbar .yr{font-family:var(--font-mono);font-size:13px;color:#C9862C;border:1px solid #4B5560;border-radius:6px;padding:3px 8px;}
.topbar .sub{font-size:12.5px;color:#AEB6BE;margin-top:4px;}
.view-title{font-family:var(--font-head);font-size:19px;font-weight:700;margin:18px 18px 4px;}
.view-hint{font-size:13px;color:var(--ink-soft);margin:0 18px 14px;line-height:1.45;}

/* ---- Main ---- */
main{flex:1;padding-bottom:96px;}
.section{padding:0 14px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;margin-bottom:11px;}
.card + .card{margin-top:0;}

/* Session list item */
.sess{display:flex;gap:12px;align-items:flex-start;cursor:pointer;}
.sess .datebox{flex:none;width:52px;text-align:center;font-family:var(--font-mono);border-right:1px dashed var(--line);padding-right:10px;}
.sess .datebox .d{font-size:20px;font-weight:600;line-height:1;}
.sess .datebox .m{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}
.sess .body{flex:1;min-width:0;}
.sess .tt{font-weight:600;font-size:15px;}
.sess .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.sess .dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.dot{width:9px;height:9px;border-radius:50%;flex:none;}
.dot.P{background:var(--green);}
.dot.FJ{background:var(--amber);}
.dot.F{background:var(--brick);}
.dot.T{background:var(--teal);}
.dot.none{background:var(--line);}
.badge-empty{display:inline-block;font-size:12px;color:var(--grey-badge);font-style:italic;}
.chip{display:inline-block;font-family:var(--font-mono);font-size:11.5px;background:#F1EEE6;border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-right:5px;color:var(--ink-soft);}

/* Section headers */
.grp-title{font-family:var(--font-head);font-size:14.5px;font-weight:700;margin:20px 4px 8px;color:var(--ink-soft);}
.grp-title:first-child{margin-top:6px;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:9px;
  padding:11px 16px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:var(--font-body);}
.btn-primary{background:var(--brick);color:#fff;}
.btn-primary:active{background:var(--brick-dark);}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn-soft{background:#F1EEE6;color:var(--ink);}
.btn-danger{background:#fff;color:var(--brick);border:1px solid var(--brick);}
.btn-block{width:100%;}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:7px;}
.fab{position:fixed;right:calc((100vw - min(520px,100vw))/2 + 18px);bottom:88px;z-index:25;
  width:56px;height:56px;border-radius:50%;background:var(--brick);color:#fff;border:none;font-size:28px;
  box-shadow:0 6px 16px rgba(140,44,34,0.4);display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* Tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);
  display:flex;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);}
.tabbar button{flex:1;background:none;border:none;padding:8px 1px 8px;display:flex;flex-direction:column;
  align-items:center;gap:2px;color:var(--grey-badge);font-size:9.5px;font-family:var(--font-body);font-weight:500;cursor:pointer;}
.tabbar button svg{width:19px;height:19px;stroke:var(--grey-badge);fill:none;stroke-width:1.8;}
.chip-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
.chip-filter{flex:none;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:7px 12px;
  font-size:12px;font-family:var(--font-mono);color:var(--ink-soft);white-space:nowrap;cursor:pointer;}
.chip-filter span{margin-left:4px;color:var(--grey-badge);}
.chip-filter.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.chip-filter.active span{color:#C9862C;}
.tabbar button.active{color:var(--brick);}
.tabbar button.active svg{stroke:var(--brick);}

/* Forms */
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:12px 0 5px;}
label:first-child{margin-top:0;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:15px;
  font-family:var(--font-body);background:#fff;color:var(--ink);}
textarea{resize:vertical;min-height:60px;}
.row2{display:flex;gap:10px;}
.row2 > *{flex:1;min-width:0;}
.member-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
.member-row-block{border-bottom:1px solid var(--line);}
.member-row-block:last-child{border-bottom:none;}
.member-row .nm{flex:1;font-size:14px;font-weight:500;}
.member-row .code{font-family:var(--font-mono);font-size:11px;color:var(--grey-badge);display:block;}
.member-row select{width:118px;flex:none;font-size:13.5px;padding:8px;}
.troca-input{font-size:13.5px;padding:8px 10px;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(20,24,30,0.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:16px 18px calc(20px + env(safe-area-inset-bottom));animation:up .18s ease-out;}
@keyframes up{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.sheet-head h2{font-family:var(--font-head);font-size:18px;margin:0;}
.sheet-head button{background:none;border:none;font-size:22px;color:var(--ink-soft);cursor:pointer;padding:4px;}
.sheet-actions{display:flex;gap:10px;margin-top:18px;}
hr.dash{border:none;border-top:1px dashed var(--line);margin:16px 0;}

/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;}
.stat .num{font-family:var(--font-mono);font-size:24px;font-weight:600;}
.stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.progress{height:7px;background:#EDEAE1;border-radius:4px;overflow:hidden;margin-top:8px;}
.progress > div{height:100%;background:var(--green);}
table.simple{width:100%;border-collapse:collapse;font-size:13px;}
table.simple th{text-align:left;font-size:11px;text-transform:none;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:6px 4px;}
table.simple td{padding:7px 4px;border-bottom:1px solid var(--line);}
table.simple td.num,table.simple th.num{text-align:right;font-family:var(--font-mono);}

.empty{text-align:center;padding:36px 20px;color:var(--ink-soft);}
.empty .ic{font-size:34px;margin-bottom:8px;}

.cmp-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
.cmp-name{width:112px;flex:none;font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cmp-track{flex:1;position:relative;height:24px;background:#F1EEE6;border-radius:6px;display:flex;align-items:center;}
.cmp-bar{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:6px;min-width:3px;}
.cmp-bar.avg{background:var(--brick);}
.cmp-val{position:relative;margin-left:8px;font-family:var(--font-mono);font-size:12px;color:var(--ink);z-index:2;}
.cmp-avg-line{margin:2px 0 10px;}

.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:20px;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;}
.toast.show{opacity:1;}

@media print{
  .tabbar,.fab,.topbar,.btn{display:none !important;}
  body{background:#fff;}
}
</style>
</head>

function seedState(){
  const sessions = DEFAULT_DATES.map((d,i)=>{
    const s = blankSession(d);
    if(SEED_FILLED[i]) Object.assign(s, SEED_FILLED[i], {id:s.id,date:d});
    return s;
  });
  return {
    team:"ALFA", year:2026, members:DEFAULT_MEMBERS.map(m=>({...m})),
    sessions,
    ocorrencias:[{id:crypto.randomUUID(),date:"2026-01-01",tipo:"EPH",obs:"",monthOnly:true}],
    physFolks: seedFisicaPeople()
  };
}

/* =========================================================
   ESTADO / PERSISTÊNCIA
   ========================================================= */
const STORE_KEY = "alfa-registo-2026-v1";
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(!data.physFolks){ data.physFolks = seedFisicaPeople(); }
      (data.members||[]).forEach(m=>{ if(m.ativo===undefined) m.ativo = true; });
      (data.sessions||[]).forEach(s=>{ if(!s.trocaCom) s.trocaCom = {}; });
      (data.ocorrencias||[]).forEach(o=>{ if(!o.envolvidos) o.envolvidos = []; if(o.outrosEnvolvidos==null) o.outrosEnvolvidos=''; });
      return data;
    }
  }catch(e){}
  return seedState();
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'),1800);
}

/* =========================================================
   HELPERS
   ========================================================= */
function fmtDateShort(iso){
  const d = new Date(iso+"T00:00:00");
  return {d:d.getDate(), m:MESES[d.getMonth()]};
}
function fmtDateFull(iso){
  const d = new Date(iso+"T00:00:00");
  return d.getDate()+" "+MESES[d.getMonth()]+" "+d.getFullYear();
}
function memberById(id){ return state.members.find(m=>m.id===id); }
function activeMembers(){ return state.members.filter(m=>m.ativo!==false); }
function sessionsSorted(){ return [...state.sessions].sort((a,b)=>a.date.localeCompare(b.date)); }
function isFuture(iso){ return iso > new Date().toISOString().slice(0,10); }
function sessionIsFilled(s){ return !!(s.areaFunc || s.instrucao || Object.values(s.att||{}).some(v=>v)); }

function hoursDoneByMember(memberId){
  let total=0;
  state.sessions.forEach(s=>{
    if(s.att && s.att[memberId]==='P' && s.duracao){ total += Number(s.duracao)||0; }
  });
  return total;
}
function countByStatus(memberId, status){
  return state.sessions.filter(s=>s.att && s.att[memberId]===status).length;
}
function totalInstrucaoHoras(){
  return state.sessions.reduce((sum,s)=> sum + (s.duracao? Number(s.duracao):0), 0);
}
function areaFuncStats(){
  const stats = {};
  state.sessions.forEach(s=>{
    if(!s.areaFunc) return;
    if(!stats[s.areaFunc]) stats[s.areaFunc] = {count:0,hours:0};
    stats[s.areaFunc].count++;
    stats[s.areaFunc].hours += s.duracao? Number(s.duracao):0;
  });
  return stats;
}
function ocorrenciasByTipo(){
  const stats = {};
  Object.keys(OCOR_TIPOS).forEach(t=>stats[t]=0);
  state.ocorrencias.forEach(o=>{ stats[o.tipo] = (stats[o.tipo]||0) + 1; });
  return stats;
}

let activeTab = "registo";
function setTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('fabBtn').style.display = (tab==='registo'||tab==='instrucoes'||tab==='equipa'||tab==='ocorrencias'||tab==='fisica') ? 'flex' : 'none';

}

document.getElementById('fabBtn').addEventListener('click', ()=>{

});

function render(){
  document.getElementById('teamNameDisplay').textContent = state.team;

/* =========================================================
   TAB: REGISTO
   ========================================================= */
function renderRegisto(){
  const list = sessionsSorted();
  const items = list.map(s=>{
    const {d,m} = fmtDateShort(s.date);
    const filled = sessionIsFilled(s);
    const dots = activeMembers().map(mem=>{
      const st = (s.att && s.att[mem.id]) || 'none';
      const partner = (s.trocaCom && s.trocaCom[mem.id]) ? ' com '+s.trocaCom[mem.id] : '';
      return `<span class="dot ${st}" title="${mem.name}: ${ATT[st]||'—'}${partner}"></span>`;
    }).join('');
    const trocas = activeMembers().filter(mem=> (s.att&&s.att[mem.id])==='T')
      .map(mem=> `${mem.code} troca com ${ (s.trocaCom&&s.trocaCom[mem.id]) || '?' }`);
    const title = filled ? (s.tema || AREA_FUNC[s.areaFunc] || 'Serviço registado') : 'Sem registo de instrução';
    const metaBits = [];
    if(s.areaFunc) metaBits.push(AREA_FUNC[s.areaFunc]);
    if(s.duracao) metaBits.push(s.duracao+"h");
    return `<div class="card sess" data-id="${s.id}">
      <div class="datebox"><div class="d">${d}</div><div class="m">${m}</div></div>
      <div class="body">
        <div class="tt">${filled? escapeHtml(title) : '<span class="badge-empty">Por preencher</span>'}</div>
        ${metaBits.length? `<div class="meta">${escapeHtml(metaBits.join(' · '))}</div>`:''}
        <div class="dots">${dots}</div>
        ${trocas.length? `<div class="meta" style="margin-top:6px;">${escapeHtml(trocas.join(' · '))}</div>`:''}
      </div>
    </div>`;
  }).join('');
  return `
    <div class="view-title">Registo de serviço</div>
    <div class="view-hint">${list.length} datas de turno em ${state.year}. Toca numa data para registar presenças e instrução.</div>
    <div class="section">${items}</div>
  `;
}

function openSessionModal(sessionId){

      <div class="member-row" style="border-bottom:none;">

        <input type="text" class="troca-input" data-member="${m.id}" value="${escapeAttr(trocaVal)}" placeholder="Troca com... (nome ou nº)">

    </div>`;

  <div class="overlay" id="sessOverlay">

      <div class="sheet-actions">
        <button class="btn btn-primary btn-block" id="saveSess">Guardar</button>
      </div>
      ${!isNew? `<div class="sheet-actions"><button class="btn btn-ghost btn-block" id="clearSess">Limpar presenças deste dia</button></div>`:''}
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
  document.querySelectorAll('.att-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const box = document.querySelector(`.troca-with[data-member="${sel.dataset.member}"]`);
      if(box) box.style.display = sel.value==='T' ? 'block' : 'none';
    });
  });
  document.getElementById('closeSess').addEventListener('click', closeModal);
  document.getElementById('sessOverlay').addEventListener('click', e=>{ if(e.target.id==='sessOverlay') closeModal(); });
  document.getElementById('saveSess').addEventListener('click', ()=>{
    const att = {}; const trocaCom = {};
    document.querySelectorAll('.att-select').forEach(sel=>{ att[sel.dataset.member] = sel.value; });
    document.querySelectorAll('.troca-input').forEach(inp=>{
      if(att[inp.dataset.member]==='T') trocaCom[inp.dataset.member] = inp.value;
    });
    const updated = { ...s, att, trocaCom };
    const idx = state.sessions.findIndex(x=>x.id===s.id);
    if(idx>=0) state.sessions[idx] = updated; else state.sessions.push(updated);
    save(); closeModal(); render(); toast('Registo guardado');
  });
  if(!isNew){
    document.getElementById('clearSess').addEventListener('click', ()=>{
      if(!confirm('Limpar as presenças e trocas deste dia? A instrução registada mantém-se.')) return;
      s.att = {}; s.trocaCom = {};
      save(); closeModal(); render(); toast('Presenças limpas');
    });
  }
}

let instrFilter = "";

  const areaStats = areaFuncStats();

  const chips = [`<button class="chip-filter ${instrFilter===''?'active':''}" data-area="">Todas <span>${totalCount}</span></button>`];
  Object.keys(AREA_FUNC).filter(k=>k!=='NA').forEach(k=>{
    const c = areaStats[k]? areaStats[k].count : 0;
    chips.push(`<button class="chip-filter ${instrFilter===k?'active':''}" data-area="${k}">${k} <span>${c}</span></button>`);
  });
  const list = sessionsSorted().slice().reverse().filter(s=> s.areaFunc && s.areaFunc!=='NA' && (!instrFilter || s.areaFunc===instrFilter));
  const items = list.map(s=>{
    const {d,m} = fmtDateShort(s.date);
    return `<div class="card sess" data-id="${s.id}">
      <div class="datebox"><div class="d">${d}</div><div class="m">${m}</div></div>

function renderEquipa(){
  const sorted = [...state.members].sort((a,b)=> (b.ativo!==false) - (a.ativo!==false));
  const rows = sorted.map(m=>{
    const inativo = m.ativo===false;
    const p = countByStatus(m.id,'P'), fj = countByStatus(m.id,'FJ'), f = countByStatus(m.id,'F'), t = countByStatus(m.id,'T');
    const horas = hoursDoneByMember(m.id);
    const pct = Math.min(100, Math.round((horas/(m.target||200))*100));
    const statusChip = inativo
      ? `<span class="chip" style="color:var(--grey-badge);">Inativo</span>`
      : `<span class="chip" style="color:var(--green);border-color:var(--green);">Ativo</span>`;

  const list = [...state.ocorrencias].sort((a,b)=>b.date.localeCompare(a.date));
  const items = list.map(o=>{
    const names = (o.envolvidos||[]).map(id=>{ const m=memberById(id); return m? m.name : id; });
    if(o.outrosEnvolvidos) names.push(o.outrosEnvolvidos);
    return `<div class="card sess" data-oid="${o.id}">
      <div class="body">
        <div class="tt">${OCOR_TIPOS[o.tipo]||o.tipo}</div>
        <div class="meta">${fmtDateFull(o.date)}${o.obs? ' · '+escapeHtml(o.obs):''}</div>
        ${names.length? `<div class="meta" style="margin-top:4px;">Envolvidos: ${escapeHtml(names.join(', '))}</div>`:''}
      </div>
    </div>`;
  }).join('') || `<div class="empty"><div class="ic">—</div>Sem ocorrências registadas.</div>`;

  const byTipo = ocorrenciasByTipo();
  const totalsRows = Object.keys(OCOR_TIPOS).map(k=>`<tr><td>${OCOR_TIPOS[k]}</td><td class="num">${byTipo[k]||0}</td></tr>`).join('');
  return `
    <div class="view-title">Ocorrências</div>
    <div class="view-hint">Registo livre de ocorrências (acidentes, emergências, incêndios, etc.) ao longo do ano.</div>
    <div class="section">
      <div class="grp-title">Totais em ${state.year}</div>
      <div class="card"><table class="simple">${totalsRows}</table></div>
      <div class="grp-title">Registos</div>
      ${items}
    </div>
  `;
}
function openOcorrenciaModal(oid){
  const o = oid ? state.ocorrencias.find(x=>x.id===oid) : {id:crypto.randomUUID(),date:new Date().toISOString().slice(0,10),tipo:'ACID',obs:'',envolvidos:[],outrosEnvolvidos:''};
  const isNew = !oid;
  const memberChecks = activeMembers().map(m=>{
    const checked = (o.envolvidos||[]).includes(m.id);
    return `<label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;color:var(--ink);margin:0;padding:7px 0;border-bottom:1px solid var(--line);">
      <input type="checkbox" class="oc-envolvido" value="${m.id}" ${checked?'checked':''} style="width:auto;">
      ${escapeHtml(m.name)} <span class="chip">${m.code}</span>
    </label>`;
  }).join('');
  const html = `<div class="overlay" id="ocOverlay"><div class="sheet">
    <div class="sheet-head"><h2>${isNew?'Nova ocorrência':'Editar ocorrência'}</h2><button id="closeOc">&times;</button></div>
    <label>Data</label><input type="date" id="f_odate" value="${o.date}">
    <label>Tipo</label><select id="f_otipo">${Object.keys(OCOR_TIPOS).map(k=>`<option value="${k}" ${o.tipo===k?'selected':''}>${OCOR_TIPOS[k]}</option>`).join('')}</select>
    <label>Quem esteve envolvido</label>
    <div class="card" style="padding:2px 12px;">${memberChecks}</div>
    <label>Outros envolvidos (fora da equipa)</label>
    <input type="text" id="f_ooutros" value="${escapeAttr(o.outrosEnvolvidos)}" placeholder="ex: bombeiro de outra corporação">
    <label>Observações</label><textarea id="f_oobs">${escapeHtml(o.obs||'')}</textarea>
    <div class="sheet-actions"><button class="btn btn-primary btn-block" id="saveOc">Guardar</button></div>
    ${!isNew?`<div class="sheet-actions"><button class="btn btn-danger btn-block" id="delOc">Eliminar</button></div>`:''}
  </div></div>`;
  document.getElementById('modalRoot').innerHTML = html;
  document.getElementById('closeOc').addEventListener('click', closeModal);
  document.getElementById('ocOverlay').addEventListener('click', e=>{ if(e.target.id==='ocOverlay') closeModal(); });
  document.getElementById('saveOc').addEventListener('click', ()=>{
    const envolvidos = Array.from(document.querySelectorAll('.oc-envolvido:checked')).map(c=>c.value);
    const updated = {...o, date:document.getElementById('f_odate').value, tipo:document.getElementById('f_otipo').value,
      envolvidos, outrosEnvolvidos:document.getElementById('f_ooutros').value, obs:document.getElementById('f_oobs').value};
    const idx = state.ocorrencias.findIndex(x=>x.id===o.id);
    if(idx>=0) state.ocorrencias[idx] = updated; else state.ocorrencias.push(updated);
    save(); closeModal(); render(); toast('Ocorrência guardada');
  });
  if(!isNew){
    document.getElementById('delOc').addEventListener('click', ()=>{
      if(!confirm('Eliminar esta ocorrência?')) return;
      state.ocorrencias = state.ocorrencias.filter(x=>x.id!==o.id);
      save(); closeModal(); render(); toast('Ocorrência eliminada');
    });
  }
}

/* =========================================================
   TAB: PREPARAÇÃO FÍSICA
   ========================================================= */
function lastDateOfPerson(p){
  const dates = p.exercises.map(e=>e.date).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d||''));
  if(!dates.length) return null;
  return dates.sort().slice(-1)[0];
}
function filledCount(p){ return p.exercises.filter(e=> e.repet!=="" && e.repet!=null).length; }

function renderFisica(){
  const cards = state.physFolks.map(p=>{
    const last = lastDateOfPerson(p);
    const fc = filledCount(p);
    return `<div class="card sess" data-pid="${p.id}">
      <div class="body">
        <div class="tt">${escapeHtml(p.name)}</div>
        <div class="meta">${fc} de ${p.exercises.length} prova${p.exercises.length===1?'':'s'} registada${fc===1?'':'s'}${last? ' · última em '+fmtDateFull(last):''}</div>
      </div>
    </div>`;
  }).join('') || `<div class="empty"><div class="ic">—</div>Ainda sem elementos. Toca em "+" para adicionar.</div>`;
  return `
    <div class="view-title">Preparação física</div>
    <div class="view-hint">Resultados dos testes de preparação física da equipa. Toca num elemento para ver ou atualizar as provas, ou usa "+" para adicionar outras atividades físicas ou um novo elemento.</div>
    <div class="section">
      <button class="btn btn-soft btn-block" id="btnComparar" style="margin-bottom:12px;">Comparar resultados</button>
      ${cards}
    </div>
  `;
}

        <div><label>Tempo</label><input type="text" class="ex-tempo" value="${escapeAttr(ex.tempo||'')}" placeholder="ex: 57s"></div>
        <div><label>Data</label><input type="text" class="ex-date" value="${escapeAttr(ex.date||'')}" placeholder="AAAA-MM-DD"></div>

    <div class="sheet-head">
      <input type="text" id="f_pname" value="${escapeAttr(p.name)}" style="border:none;background:transparent;font-family:var(--font-head);font-size:18px;font-weight:700;padding:0;flex:1;color:var(--ink);">
      <button id="closeFis">&times;</button>

    <div class="sheet-actions"><button class="btn btn-primary btn-block" id="saveFis">Guardar</button></div>

  </div></div>`;

  function bindRemove(){

      btn.onclick = ()=>{ btn.closest('.exrow').remove(); };

  bindRemove();
  document.getElementById('addEx').addEventListener('click', ()=>{

/* ---- Comparação de resultados (equipa vs individual) ---- */
function collectExerciseNames(){
  const set = new Set();
  state.physFolks.forEach(p=> p.exercises.forEach(e=>{ if(e.nome) set.add(e.nome); }));
  const arr = Array.from(set);
  const std = STANDARD_EXERCISES.filter(n=>arr.includes(n));
  const rest = arr.filter(n=>!STANDARD_EXERCISES.includes(n)).sort((a,b)=>a.localeCompare(b,'pt'));
  return [...std, ...rest];
}
function numericValuesForExercise(nome){
  const out = [];
  state.physFolks.forEach(p=>{
    const ex = p.exercises.find(e=>e.nome===nome);
    if(!ex) return;
    const raw = String(ex.repet==null?'':ex.repet).trim().replace(',','.');
    if(raw==='') return;
    const v = parseFloat(raw);
    if(!isNaN(v)) out.push({name:p.name, value:v});
  });
  return out;
}
function formatNum(v){
  return Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/,'').replace(/\.$/,'');
}
function renderComparar(selectedExercise){
  const names = collectExerciseNames();
  if(!names.length) return `<div class="empty"><div class="ic">—</div>Ainda não há atividades registadas para comparar.</div>`;
  const exercise = names.includes(selectedExercise) ? selectedExercise : names[0];
  const data = numericValuesForExercise(exercise);
  const sortedData = [...data].sort((a,b)=>b.value-a.value);
  const max = data.length ? Math.max(...data.map(d=>d.value), ...(data.length?[data.reduce((s,d)=>s+d.value,0)/data.length]:[0])) : 0;
  const avg = data.length ? data.reduce((s,d)=>s+d.value,0)/data.length : 0;
  const bar = (val)=> max? Math.max(3, Math.round((val/max)*100)) : 0;

  const rows = sortedData.map(d=>`
    <div class="cmp-row">
      <div class="cmp-name">${escapeHtml(d.name)}</div>
      <div class="cmp-track"><div class="cmp-bar" style="width:${bar(d.value)}%"></div><span class="cmp-val">${formatNum(d.value)}</span></div>
    </div>`).join('') || `<div class="empty"><div class="ic">—</div>Sem valores numéricos registados nesta atividade.</div>`;

  const avgBlock = data.length ? `
    <div class="cmp-avg-line">
      <div class="cmp-row" style="padding:0;">
        <div class="cmp-name" style="font-weight:700;">Média da equipa</div>
        <div class="cmp-track"><div class="cmp-bar avg" style="width:${bar(avg)}%"></div><span class="cmp-val">${formatNum(avg)}</span></div>
      </div>
    </div>
    <hr class="dash">` : '';

  return `
    <label style="margin-top:0;">Atividade</label>
    <select id="cmpExercise">${names.map(n=>`<option value="${escapeAttr(n)}" ${n===exercise?'selected':''}>${escapeHtml(n)}</option>`).join('')}</select>
    ${avgBlock}
    <div id="cmpRows">${rows}</div>
  `;
}
function openComparaModal(){
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" id="cmpOverlay"><div class="sheet">
    <div class="sheet-head"><h2>Comparar resultados</h2><button id="closeCmp">&times;</button></div>
    <div id="cmpBody">${renderComparar()}</div>
  </div></div>`;
  document.getElementById('closeCmp').addEventListener('click', closeModal);
  document.getElementById('cmpOverlay').addEventListener('click', e=>{ if(e.target.id==='cmpOverlay') closeModal(); });
  bindCmpSelect();
}
function bindCmpSelect(){
  const sel = document.getElementById('cmpExercise');
  if(sel) sel.addEventListener('change', ()=>{
    document.getElementById('cmpBody').innerHTML = renderComparar(sel.value);
    bindCmpSelect();
  });
}

    <div class="section">

        <div class="stat"><div class="num">${totalHoras}h</div><div class="lbl">Horas de instrução</div></div>

      <div class="card">
        <button class="btn btn-ghost btn-block" id="btnExport" style="margin-bottom:10px;">Exportar cópia de segurança (.json)</button>
        <button class="btn btn-ghost btn-block" id="btnImport" style="margin-bottom:10px;">Importar cópia de segurança</button>
        <input type="file" id="fileImport" accept="application/json" style="display:none;">
        <button class="btn btn-ghost btn-block" id="btnPrint" style="margin-bottom:10px;">Imprimir resumo</button>
        <button class="btn btn-danger btn-block" id="btnReset">Repor dados de origem</button>
      </div>
    </div>
  `;
}

/* =========================================================
   HANDLERS DE VISTA / UTILITÁRIOS
   ========================================================= */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function escapeHtml(str){
  return (str==null?'':String(str)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

function attachViewHandlers(){
  document.querySelectorAll('.sess[data-id]').forEach(el=>{
    el.addEventListener('click', ()=> activeTab==='instrucoes' ? openInstrucaoModal(el.dataset.id) : openSessionModal(el.dataset.id));
  });
  document.querySelectorAll('.chip-filter').forEach(btn=>{
    btn.addEventListener('click', ()=>{ instrFilter = btn.dataset.area; render(); });
  });
  document.querySelectorAll('.sess[data-pid]').forEach(el=>{
    el.addEventListener('click', ()=>openFisicaPersonModal(el.dataset.pid));
  });
  const bc = document.getElementById('btnComparar');
  if(bc) bc.addEventListener('click', openComparaModal);
  document.querySelectorAll('.sess[data-oid]').forEach(el=>{
    el.addEventListener('click', ()=>openOcorrenciaModal(el.dataset.oid));
  });
  document.querySelectorAll('.edit-member').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openMemberModal(btn.closest('[data-mid]').dataset.mid);
    });
  });
  const st = document.getElementById('saveSettings');
  if(st) st.addEventListener('click', ()=>{
    state.team = document.getElementById('f_team').value || state.team;
    state.year = Number(document.getElementById('f_year').value) || state.year;
    save(); render(); toast('Configurações guardadas');
  });
  const be = document.getElementById('btnExport');
  if(be) be.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `alfa-registo-${state.year}-backup.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Cópia exportada');
  });
  const bi = document.getElementById('btnImport');
  const fi = document.getElementById('fileImport');
  if(bi) bi.addEventListener('click', ()=>fi.click());
  if(fi) fi.addEventListener('change', ()=>{
    const file = fi.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!data.sessions || !data.members) throw new Error('formato inválido');
        state = data; save(); render(); toast('Dados importados');
      }catch(e){ alert('Não foi possível importar este ficheiro.'); }
    };
    reader.readAsText(file);
  });
  const bp = document.getElementById('btnPrint');
  if(bp) bp.addEventListener('click', ()=>window.print());
  const br = document.getElementById('btnReset');
  if(br) br.addEventListener('click', ()=>{
    if(!confirm('Isto substitui todos os dados atuais pelos dados originais da folha ALFA-2026. Continuar?')) return;
    state = seedState(); save(); render(); toast('Dados repostos');
  });
}
